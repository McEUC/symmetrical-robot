name: Video Processor Worker

on:
  repository_dispatch:
    types: [video-job]

jobs:
  build-video:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # --- MODIFIED: Setup Python with Caching ---
      - name: Set up Python and Cache Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # This enables caching for pip

      # --- MODIFIED: Install Dependencies from requirements.txt ---
      - name: Install Dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install ffmpeg
          pip install -r requirements.txt

      - name: Run Video Processor
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FLASK_VM_IP: ${{ secrets.FLASK_VM_IP }} # Add this secret in GitHub
        run: python -u worker.py

