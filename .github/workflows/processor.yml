name: Video Processor Worker

on:
  repository_dispatch:
    types: [video-job]

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install ffmpeg
          pip install boto3 requests beautifulsoup4 google-api-python-client google-cloud-aiplatform vertexai

      - name: Run Video Processor
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: python -u worker.py
