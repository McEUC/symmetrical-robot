name: Video Processor Worker

on:
  repository_dispatch:
    types: [video-job]

jobs:
  build-video:
    runs-on: ubuntu-latest
    
    # Add permissions for the authentication action
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- NEW: Add this step to authenticate to Google Cloud ---
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install ffmpeg
          pip install boto3 requests beautifulsoup4 google-api-python-client google-cloud-aiplatform vertexai

      - name: Run Video Processor
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # Pass the project ID to the script
        run: python -u worker.py
